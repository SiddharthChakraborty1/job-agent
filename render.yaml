services:
  - type: web
    name: resume-job-finder-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.2"
      - key: COOKIE_SECURE
        value: "true"
      # Set these in the Render dashboard (sync: false = secret):
      - key: OPENAI_API_KEY
        sync: false
      - key: COSTLY_MODEL
        value: gpt-4o
      - key: CHEAP_MODEL
        value: gpt-4o-mini
      - key: SERPER_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: RESUME_UPLOAD_LIMIT
        value: "5"
      - key: RESUME_UPLOAD_WINDOW_SECONDS
        value: "3600"
      # Firestore (firebase-admin is installed via requirements.txt)
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
